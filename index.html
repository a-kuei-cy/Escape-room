<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>興嘉國小閱讀素養密室逃脫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            overflow-x: hidden;
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">

    <!-- 全域 Loading 遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex flex-col items-center justify-center">
        <i class="fas fa-circle-notch fa-spin text-5xl text-emerald-500 mb-4"></i>
        <p id="loadingText" class="text-xl font-bold tracking-widest text-emerald-400">連線至雲端石板中...</p>
    </div>

    <!-- 自訂 Alert 警告框 -->
    <div id="customAlert" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="glass-panel max-w-sm w-full rounded-2xl p-6 text-center shadow-2xl">
            <i class="fas fa-exclamation-circle text-4xl text-amber-400 mb-4"></i>
            <h3 id="alertTitle" class="text-2xl font-bold mb-2">提示</h3>
            <p id="alertMessage" class="text-slate-300 mb-6"></p>
            <button onclick="closeAlert()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-lg w-full transition">我知道了</button>
        </div>
    </div>

    <!-- 自訂 Confirm 確認框 -->
    <div id="customConfirm" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="glass-panel max-w-sm w-full rounded-2xl p-6 text-center shadow-2xl">
            <i class="fas fa-question-circle text-4xl text-rose-400 mb-4"></i>
            <h3 id="confirmTitle" class="text-2xl font-bold mb-2 text-rose-300">確認操作</h3>
            <p id="confirmMessage" class="text-slate-300 mb-6"></p>
            <div class="flex gap-4">
                <button onclick="closeConfirm(false)" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 rounded-lg transition">取消</button>
                <button onclick="closeConfirm(true)" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-lg transition">確認執行</button>
            </div>
        </div>
    </div>

    <header class="w-full max-w-5xl flex justify-between items-center mb-8 glass-panel p-4 rounded-2xl">
        <div class="flex items-center gap-3 text-emerald-400">
            <i class="fas fa-book-reader text-3xl"></i>
            <h1 class="text-xl sm:text-2xl font-bold tracking-wide">興嘉國小 閱讀素養密室</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('home-tab')" class="p-2 sm:px-4 sm:py-2 rounded bg-slate-700 hover:bg-slate-600 transition text-sm sm:text-base">
                <i class="fas fa-home"></i> <span class="hidden sm:inline">首頁</span>
            </button>
            <button onclick="switchTab('admin-tab')" class="p-2 sm:px-4 sm:py-2 rounded bg-indigo-700 hover:bg-indigo-600 transition text-sm sm:text-base">
                <i class="fas fa-cog"></i> <span class="hidden sm:inline">題庫管理</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-5xl flex-1 relative">
        
        <section id="home-tab" class="tab-content w-full max-w-2xl mx-auto mt-10">
            <div class="glass-panel p-8 rounded-3xl text-center shadow-2xl">
                <i class="fas fa-door-closed text-6xl text-slate-400 mb-6"></i>
                <h2 class="text-3xl font-extrabold mb-4 text-emerald-300">智慧之門挑戰</h2>
                <p class="text-slate-300 mb-8 leading-relaxed">
                    冒險者，歡迎來到閱讀素養密室。<br>請輸入你的身分，開啟無盡的挑戰吧！<br>
                    <span id="totalQuestionsInfo" class="text-indigo-300 font-bold text-sm mt-2 block">(載入題庫中...)</span>
                </p>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 text-slate-900">
                    <select id="grade" class="w-full p-3 rounded-xl border-2 border-transparent focus:border-emerald-500 focus:outline-none font-bold bg-slate-100">
                        <option value="">選擇年級</option>
                        <option value="一年級">一年級</option><option value="二年級">二年級</option>
                        <option value="三年級">三年級</option><option value="四年級">四年級</option>
                        <option value="五年級">五年級</option><option value="六年級">六年級</option>
                    </select>
                    <select id="className" class="w-full p-3 rounded-xl border-2 border-transparent focus:border-emerald-500 focus:outline-none font-bold bg-slate-100">
                        <option value="">選擇班級</option>
                        <option value="1班">1班</option><option value="2班">2班</option>
                        <option value="3班">3班</option><option value="4班">4班</option>
                        <option value="5班">5班</option><option value="6班">6班</option>
                        <option value="7班">7班</option><option value="8班">8班</option>
                    </select>
                    <input type="text" id="name" placeholder="輸入姓名" class="w-full p-3 rounded-xl border-2 border-transparent focus:border-emerald-500 focus:outline-none font-bold bg-slate-100">
                </div>

                <button onclick="startGame()" class="w-full py-4 text-xl font-bold bg-emerald-600 hover:bg-emerald-500 rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-3">
                    <i class="fas fa-key"></i> 開啟石門 (Start Challenge)
                </button>
            </div>
        </section>

        <section id="game-tab" class="tab-content hidden w-full">
            <div class="glass-panel p-4 sm:p-6 rounded-3xl mb-6 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-full border border-slate-600">
                    <i class="fas fa-user-astronaut text-emerald-400"></i>
                    <span id="displayPlayerInfo" class="font-bold tracking-wide"></span>
                </div>
                <div class="flex gap-4">
                    <div class="bg-rose-900/50 border border-rose-500/30 px-5 py-2 rounded-xl text-center">
                        <div class="text-xs text-rose-300 font-bold">時間 TIMER</div>
                        <div class="text-xl font-extrabold text-rose-400 flex items-center justify-center gap-2">
                            <i class="fas fa-hourglass-half"></i> <span id="timerText">45s</span>
                        </div>
                    </div>
                    <div class="bg-indigo-900/50 border border-indigo-500/30 px-5 py-2 rounded-xl text-center">
                        <div class="text-xs text-indigo-300 font-bold">目前得分 Score</div>
                        <div class="text-xl font-extrabold text-indigo-400"><span id="currentScore">0</span> 題</div>
                    </div>
                </div>
            </div>

            <!-- 進度條 -->
            <div class="w-full bg-slate-800 rounded-full h-3 mb-6 overflow-hidden border border-slate-700">
                <div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="glass-panel p-6 sm:p-8 rounded-3xl shadow-2xl relative">
                <div class="absolute -top-4 -left-2 bg-indigo-600 text-white px-4 py-1 rounded-full text-sm font-bold shadow-lg border border-indigo-400" id="questionProgress">關卡 1 / ?</div>
                
                <div id="passageBox" class="mt-4 mb-6 p-5 bg-slate-800/80 rounded-xl text-slate-200 leading-relaxed text-lg border-l-4 border-emerald-500">
                    載入引文中...
                </div>
                
                <h3 id="questionBox" class="text-xl sm:text-2xl font-bold mb-6 text-amber-300 leading-snug">載入題目中...</h3>
                
                <div id="optionsGrid" class="grid grid-cols-1 gap-4">
                    <!-- 選項將由 JS 動態生成 -->
                </div>
            </div>
        </section>

        <section id="result-tab" class="tab-content hidden w-full max-w-2xl mx-auto mt-10">
            <div class="glass-panel p-8 sm:p-12 rounded-3xl text-center shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-400 to-rose-500"></div>
                <i class="fas fa-trophy text-7xl text-amber-400 mb-6 drop-shadow-[0_0_15px_rgba(251,191,36,0.6)]"></i>
                <h2 class="text-4xl font-extrabold mb-2 text-white">挑戰結束</h2>
                <p class="text-slate-300 mb-8">智慧的探求永無止境</p>
                
                <div class="bg-slate-800 rounded-2xl p-6 mb-8 inline-block border border-slate-600">
                    <p class="text-sm text-slate-400 mb-1">最終連續答對</p>
                    <p class="text-6xl font-black text-emerald-400"><span id="finalScore">0</span> <span class="text-2xl text-emerald-600">題</span></p>
                </div>
                
                <p id="saveStatusText" class="text-indigo-300 mb-8 font-bold animate-pulse">正在將成績銘刻至雲端石板...</p>
                
                <button onclick="resetToHome()" class="w-full py-4 text-xl font-bold bg-slate-700 hover:bg-slate-600 rounded-xl shadow-lg transition flex items-center justify-center gap-3">
                    <i class="fas fa-undo"></i> 返回首頁重新挑戰
                </button>
            </div>
        </section>

        <section id="admin-tab" class="tab-content hidden w-full max-w-4xl mx-auto">
            <div id="adminLoginSection" class="glass-panel p-8 rounded-3xl text-center max-w-md mx-auto mt-10">
                <i class="fas fa-user-shield text-5xl text-indigo-400 mb-6"></i>
                <h2 class="text-2xl font-bold mb-6">管理者結界認證</h2>
                <input type="password" id="adminPassword" placeholder="輸入管理者密碼" class="w-full p-3 rounded-xl border-2 border-transparent focus:border-indigo-500 bg-slate-100 text-slate-900 mb-4 text-center font-bold">
                <button onclick="adminLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg">解除結界 (Login)</button>
            </div>

            <div id="adminDashboard" class="hidden">
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-3xl font-extrabold text-indigo-300"><i class="fas fa-database"></i> 雲端題庫管理</h2>
                    <button onclick="renderAdminQuestions()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition"><i class="fas fa-sync"></i> 重新載入</button>
                </div>

                <div class="glass-panel p-6 rounded-2xl mb-8 overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead>
                            <tr class="border-b border-slate-600 text-slate-300">
                                <th class="p-3">ID</th><th class="p-3 w-1/4">題目主幹</th><th class="p-3 w-1/4">引文</th><th class="p-3">答案</th><th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminQuestionsTbody" class="divide-y divide-slate-700 text-sm">
                            <!-- 題目列表由 JS 生成 -->
                        </tbody>
                    </table>
                </div>

                <h2 class="text-3xl font-extrabold text-emerald-300 mb-6 mt-12"><i class="fas fa-chart-bar"></i> 勇者排行榜 (前 50 名)</h2>
                <div class="glass-panel p-6 rounded-2xl overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="border-b border-slate-600 text-slate-300">
                                <th class="p-3">挑戰時間</th><th class="p-3">年級</th><th class="p-3">班級</th><th class="p-3">姓名</th><th class="p-3">答對題數</th>
                            </tr>
                        </thead>
                        <tbody id="adminScoresTbody" class="divide-y divide-slate-700">
                            <!-- 成績列表由 JS 生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <footer class="mt-8 py-4 text-center text-slate-500 text-sm w-full font-bold">
        <p>興嘉國小 閱讀素養密室逃脫系統 &copy; 2024</p>
    </footer>

    <script>
        // ==========================================
        //  全域變數與狀態
        // ==========================================
        let questions = []; 
        let cloudQuestionsData = [];
        let localBackupQuestions = [];
        let gameQueue = []; 
        let currentQuestionIndex = 0; 
        let score = 0;
        let playerInfo = { grade: '', className: '', name: '' };
        
        let timerInterval = null;
        const QUESTION_TIME_LIMIT = 45; 
        let timeLeft = QUESTION_TIME_LIMIT;
        let currentShuffledOptions = [];
        let isAdminLoggedIn = false;

        // GAS 後端網址
        const defaultApiUrl = "https://script.google.com/macros/s/AKfycby_tjcqPe-fIBtuUizWuOy3Yj39LqXzaLG_I6Wl-1ZY0r10GAHT1yCtQ8MpyS9kCIqZ/exec";
        let googleApiUrl = localStorage.getItem('xingjia_gas_url') || defaultApiUrl;

        // ==========================================
        //  輔助工具函式 (Utility Functions)
        // ==========================================
        function showLoading(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // 自訂 Alert (取代原生 alert)
        function showCustomAlert(title, message) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('customAlert').classList.remove('hidden');
        }
        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        // 自訂 Confirm (取代原生 confirm)
        let confirmCallback = null;
        function showCustomConfirm(title, message, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            document.getElementById('customConfirm').classList.remove('hidden');
            confirmCallback = callback;
        }
        function closeConfirm(result) {
            document.getElementById('customConfirm').classList.add('hidden');
            if (confirmCallback) confirmCallback(result);
            confirmCallback = null;
        }

        // 洗牌演算法 (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 姓名遮罩 (去識別化)
        function maskName(name) {
            if (!name) return "無名氏";
            if (name.length <= 2) return name.charAt(0) + "○";
            return name.charAt(0) + "○".repeat(name.length - 2) + name.slice(-1);
        }

        // ==========================================
        //  資料初始化與混合邏輯
        // ==========================================
        window.onload = () => {
            buildFullDataset();
            loadCloudData();
        };

        function buildFullDataset() {
            // 精選 5 題高品質樣板
            const extLibrary = [
                { p: "科學思辨中，糖在高溫下溶解速度加快。但並非所有固體的溶解度都會隨著溫度升高而增加，例如氫氧化鈣在高溫下的溶解度反而下降。", q: "關於溶解度與溫度的關係，下列哪一個科學觀念最客觀？", a: "所有固體在熱水裡的溶解量一定比冷水多", b: "不同化學物質具獨特物理溶解特性，不能單一經驗套用", c: "只要將水拼命加熱，就能無限量溶解所有的固體", d: "液體的溫度對固體溶解量完全沒有關係", ans: "B", exp: "糖的特性不能代表全體固體（如氫氧化鈣即是特例）。科學精神講求嚴謹，切忌以偏概全。" },
                { p: "台灣的地名背後常含有歷史故事。例如「民雄」舊稱「打貓」，是源自於平埔族洪雅族社名「Taneaw」的閩南語音譯，日治時期因音近而改名。", q: "「打貓」改名為「民雄」的主要關鍵因應了哪一項演變？", a: "日治時期官方對於台語發音進行了諧音日語化改譯", b: "當地原住民與漢人發生嚴重的貓咪產權糾紛", c: "清朝官員認為打貓聽起來太粗俗而下令更改", d: "當地居民舉行了全體公投投票改名", ans: "A", exp: "由平埔族語轉台語，再因日語發音相近改名。地名變更體現了不同政權在語言上的歷史軌跡。" },
                { p: "情緒勒索是一種關係中的控制手段，通常由一方利用另一方的內疚感、恐懼感或責任感，來強迫對方順從自己的要求。", q: "面對關係中的情緒勒索，哪一種因應之道最健康？", a: "為了維持和諧，無條件答應對方的所有要求", b: "建立明確的個人界線，冷靜溫和地拒絕不合理的要求", c: "立刻以更大的聲音對罵回去，打碎對方的自尊心", d: "假裝沒聽到，徹底斷絕與對方的所有聯絡", ans: "B", exp: "設立自我界線，並溫和堅定地對事不對人，才是阻斷情緒勒索、維護健康關係的方法。" },
                { p: "「特洛伊木馬」出自希臘神話，希臘聯軍建造巨大木馬假意退兵，特洛伊人將其作為戰利品拉入城內，深夜木馬內的伏兵開城門攻陷該城。", q: "現代防毒軟體常提到「木馬病毒」，是借用了神話的哪一項特徵？", a: "病毒長得很像一隻巨大的木頭駿馬", b: "偽裝成安全無害的檔案，引誘使用者下載後在內部發動破壞", c: "它只會破壞希臘或特洛伊當地的網路電腦", d: "這種病毒完全由木頭材質製成", ans: "B", exp: "木馬計策在於『外表假裝無害，實則包藏禍心』。電腦木馬也是偽裝成正常軟體，待執行後破壞系統。" },
                { p: "電子書雖然輕便、好攜帶，且能裝載上千本書籍，但傳統實體書特有的紙張質感與翻閱時的觸覺反饋，依然是無法取代的情懷。", q: "如果學校圖書館要推廣閱讀，哪一種採購策略最能兼顧這段話的價值？", a: "將所有實體書銷毀，全面改買電子書平板", b: "同步購置實體書籍與電子書平台，提供多元閱讀觸覺與選擇", c: "完全禁止購買電子書，只買厚重的精裝書", d: "採購大量益智玩具代替書籍", ans: "B", exp: "電子書有便利性，紙本書有翻閱溫度。兩者相輔相成，多元購置能提供更深度的體驗。" }
            ];

            localBackupQuestions = [];
            for (let i = 1; i <= 50; i++) {
                const template = extLibrary[(i - 1) % extLibrary.length];
                localBackupQuestions.push({
                    id: i,
                    passage: template.p,
                    question: `【核心素養 - 第 ${i} 關】${template.q}`,
                    optionA: template.a, optionB: template.b, optionC: template.c, optionD: template.d,
                    answer: template.ans,
                    exp: `【第 ${i} 題解析】${template.exp}`
                });
            }
        }

        // 核心：無上限智慧融合邏輯
        function mergeCloudAndLocalQuestions(cloudQs) {
            const merged = [...cloudQs];
            localBackupQuestions.forEach(localQ => {
                // 比對題目文字，避免重複
                const isDuplicate = merged.some(q => 
                    (q.question || "").trim() === (localQ.question || "").trim()
                );
                if (!isDuplicate) {
                    merged.push(localQ);
                }
            });
            // 重新編號，確保所有題目的 ID 順序正確
            return merged.map((q, idx) => ({ ...q, id: idx + 1 }));
        }

        async function loadCloudData() {
            showLoading("讀取雲端題庫與排行榜...");
            try {
                const res = await fetch(googleApiUrl + "?action=getQuestions");
                const data = await res.json();
                if (data.status === 'success' && Array.isArray(data.data)) {
                    cloudQuestionsData = data.data;
                    questions = mergeCloudAndLocalQuestions(cloudQuestionsData);
                } else {
                    questions = [...localBackupQuestions];
                }
            } catch (error) {
                console.warn("Cloud Data Fetch Failed, using local backup.", error);
                questions = [...localBackupQuestions]; // 發生異常時使用本機備援
            }
            document.getElementById('totalQuestionsInfo').innerText = `(雲端與本機共融合 ${questions.length} 道關卡)`;
            hideLoading();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        // ==========================================
        //  遊戲流程核心邏輯
        // ==========================================
        function startGame() {
            const grade = document.getElementById('grade').value;
            const className = document.getElementById('className').value;
            const name = document.getElementById('name').value.trim();

            if (!grade || !className || !name) {
                showCustomAlert('身分未明', '勇敢的探險者，請完整選擇並填寫您的「年級」、「班級」與「姓名」，石門才會為您開啟喔！');
                return;
            }

            playerInfo = { grade, className, name };
            score = 0;
            currentQuestionIndex = 0;
            
            // 深度複製題庫並洗牌
            gameQueue = JSON.parse(JSON.stringify(questions));
            shuffleArray(gameQueue);
            
            document.getElementById('displayPlayerInfo').innerText = `${grade}${className} ${maskName(name)}`;
            document.getElementById('currentScore').innerText = '0';
            
            switchTab('game-tab');
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuestionIndex >= gameQueue.length) {
                // 全部答對，遊戲通關！
                handleGameOver(true);
                return;
            }
            
            const q = gameQueue[currentQuestionIndex];
            const totalQs = gameQueue.length;
            
            document.getElementById('questionProgress').innerText = `關卡 ${currentQuestionIndex + 1} / ${totalQs}`;
            const progressPercent = (currentQuestionIndex / totalQs) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
            
            document.getElementById('passageBox').innerText = q.passage || "【無引文，請直接根據生活常識與題目作答】";
            document.getElementById('questionBox').innerText = q.question;
            
            // 準備選項並洗牌
            const rawOptions = [
                { text: q.optionA, isCorrect: q.answer === 'A' },
                { text: q.optionB, isCorrect: q.answer === 'B' },
                { text: q.optionC, isCorrect: q.answer === 'C' },
                { text: q.optionD, isCorrect: q.answer === 'D' }
            ];
            currentShuffledOptions = [...rawOptions];
            shuffleArray(currentShuffledOptions);
            
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            currentShuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-700/80 hover:bg-slate-600 border-2 border-slate-600 hover:border-emerald-500 transition-all text-lg flex items-start gap-3 shadow-sm";
                btn.innerHTML = `<span class="font-extrabold text-emerald-400 block mt-0.5">${labels[idx]}.</span> <span class="flex-1 text-slate-100">${opt.text}</span>`;
                btn.onclick = () => checkAnswer(idx);
                optionsGrid.appendChild(btn);
            });
            
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = QUESTION_TIME_LIMIT;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showCustomAlert("時間耗盡", "思考的時間已經超過限制，石門已重新關閉！\n挑戰失敗，請再接再厲。");
                    handleGameOver(false);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('timerText');
            timerEl.innerText = `${timeLeft}s`;
            if (timeLeft <= 10) {
                timerEl.classList.remove('text-rose-400');
                timerEl.classList.add('text-red-500', 'animate-pulse');
            } else {
                timerEl.classList.remove('text-red-500', 'animate-pulse');
                timerEl.classList.add('text-rose-400');
            }
        }

        function checkAnswer(selectedIdx) {
            clearInterval(timerInterval);
            const correctIdx = currentShuffledOptions.findIndex(o => o.isCorrect);
            const q = gameQueue[currentQuestionIndex];
            
            if (selectedIdx === correctIdx) {
                // 答對
                score++;
                currentQuestionIndex++;
                document.getElementById('currentScore').innerText = score;
                renderQuestion();
            } else {
                // 答錯
                showCustomAlert("答錯了！挑戰中止", `正確的觀念應該是：\n\n${q.exp || "無提供進階解析。"}\n\n閱讀素養需要細心與耐心，請吸收解析後再次挑戰！`);
                handleGameOver(false);
            }
        }

        function handleGameOver(isWin) {
            switchTab('result-tab');
            document.getElementById('finalScore').innerText = score;
            saveScoreToCloud();
        }

        async function saveScoreToCloud() {
            const statusText = document.getElementById('saveStatusText');
            statusText.innerText = "正在將您的豐功偉業銘刻至雲端石板...";
            statusText.className = "text-amber-300 mb-8 font-bold animate-pulse";
            
            try {
                const payload = {
                    action: "saveScore",
                    grade: playerInfo.grade,
                    className: playerInfo.className,
                    name: playerInfo.name,
                    score: score
                };
                
                await fetch(googleApiUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                statusText.innerText = "銘刻成功！您的成績已記錄。";
                statusText.className = "text-emerald-400 mb-8 font-bold";
            } catch (error) {
                statusText.innerText = "成績上傳發生異常，但仍為您保留本機記錄。";
                statusText.className = "text-rose-400 mb-8 font-bold";
                console.error(error);
            }
        }

        function resetToHome() {
            switchTab('home-tab');
            document.getElementById('name').value = '';
        }

        // ==========================================
        //  管理者後台邏輯
        // ==========================================
        function adminLogin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === "8888") { // 預設密碼
                isAdminLoggedIn = true;
                document.getElementById('adminLoginSection').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                renderAdminQuestions();
                renderAdminScores();
            } else {
                showCustomAlert("密碼錯誤", "結界排斥了您的訪問，請輸入正確的管理者密碼。");
            }
        }

        function renderAdminQuestions() {
            const tbody = document.getElementById('adminQuestionsTbody');
            tbody.innerHTML = '';
            
            if (cloudQuestionsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">雲端題庫目前為空，或尚未連線成功。</td></tr>';
                return;
            }

            cloudQuestionsData.forEach(q => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-mono text-emerald-400">#${q.id}</td>
                    <td class="p-3"><div class="line-clamp-2" title="${q.question}">${q.question}</div></td>
                    <td class="p-3 text-slate-400"><div class="line-clamp-2 text-xs" title="${q.passage}">${q.passage || '無'}</div></td>
                    <td class="p-3 font-bold text-amber-300">${q.answer}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteCloudQuestion(${q.id})" class="bg-rose-700 hover:bg-rose-600 text-white px-3 py-1 rounded shadow text-xs transition">
                            <i class="fas fa-trash"></i> 刪除
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteCloudQuestion(id) {
            showCustomConfirm("刪除確認", `您確定要將雲端題庫中 ID 為 ${id} 的題目刪除嗎？\n此動作不可逆！`, async (confirmed) => {
                if (confirmed) {
                    showLoading("刪除中...");
                    try {
                        const payload = { action: "deleteQuestion", id: id };
                        const res = await fetch(googleApiUrl, { method: 'POST', body: JSON.stringify(payload) });
                        const result = await res.json();
                        
                        if (result.status === 'success') {
                            showCustomAlert("成功", "題目已順利從雲端刪除！");
                            await loadCloudData(); // 重新載入最新資料
                            renderAdminQuestions();
                        } else {
                            showCustomAlert("錯誤", result.message || "刪除失敗");
                        }
                    } catch (error) {
                        showCustomAlert("錯誤", "連線異常：" + error);
                    }
                    hideLoading();
                }
            });
        }

        async function renderAdminScores() {
            const tbody = document.getElementById('adminScoresTbody');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400"><i class="fas fa-spinner fa-spin"></i> 載入成績中...</td></tr>';
            
            try {
                const res = await fetch(googleApiUrl + "?action=getScores");
                const data = await res.json();
                
                if (data.status === 'success' && data.data) {
                    // 排序：先比分數高低，再比時間先後，並只取前 50 名
                    const sortedScores = data.data.sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        return new Date(a.timestamp) - new Date(b.timestamp);
                    }).slice(0, 50);

                    tbody.innerHTML = '';
                    sortedScores.forEach((s, index) => {
                        let rankIcon = `<span class="text-slate-400 font-bold">#${index + 1}</span>`;
                        if (index === 0) rankIcon = `<i class="fas fa-crown text-yellow-400 text-xl"></i>`;
                        else if (index === 1) rankIcon = `<i class="fas fa-crown text-gray-300 text-lg"></i>`;
                        else if (index === 2) rankIcon = `<i class="fas fa-crown text-amber-600 text-md"></i>`;

                        const tr = document.createElement('tr');
                        tr.className = index < 3 ? "bg-slate-800/60" : "";
                        tr.innerHTML = `
                            <td class="p-3 text-xs text-slate-400">${new Date(s.timestamp).toLocaleString('zh-TW')}</td>
                            <td class="p-3">${s.grade}</td>
                            <td class="p-3">${s.className}</td>
                            <td class="p-3 font-bold flex items-center gap-2">${rankIcon} ${maskName(s.name)}</td>
                            <td class="p-3 font-black text-emerald-400">${s.score}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    
                    if (sortedScores.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">目前尚無勇者成績紀錄。</td></tr>';
                    }
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">成績載入失敗：${error}</td></tr>`;
            }
        }
    </script>
</body>
</html>
